/* VOICE: sobria, de campaña, segura; negro y blanco sin adornos

.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;margin:0 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.top a{color:var(--ink);text-decoration:none}
.brand{font-family:Oswald,sans-serif;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.back{font-size:11px;letter-spacing:.2em;color:var(--soft)!important;text-transform:uppercase;padding:10px 0}
.back:hover{color:var(--ink)!important}

.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(10,10,10,.55) 0%,rgba(10,10,10,.15) 30%,rgba(10,10,10,.35) 60%,var(--bg) 100%),radial-gradient(ellipse 90% 80% at 60% 40%,transparent 50%,rgba(10,10,10,.7) 100%)}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bgimg{animation:none}}
@media (max-width:600px){.hero{min-height:64vh}.bgimg{background-position:72% 30%}}
h1{font-family:Oswald,sans-serif;text-transform:uppercase;text-align:center;margin:0;position:relative;z-index:2;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.6)}
h1 .a{display:block;font-weight:300;font-size:clamp(38px,7vw,64px);letter-spacing:.01em}
h1 .b{display:block;font-weight:700;font-size:clamp(48px,9vw,84px);letter-spacing:.01em}
main{display:flex;justify-content:center;padding:0 16px 40px;margin-top:-8px;position:relative;z-index:2}
.card{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:28px 26px 26px}
.card h2{font-family:Oswald,sans-serif;font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
.intro{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:0 0 18px;line-height:1.6}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.prog span{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
.bar{flex:1;height:1px;background:var(--line);position:relative}
.bar i{position:absolute;left:0;top:-.5px;height:2px;background:var(--ink);transition:width .4s ease}
label.q{display:block;font-size:13px;color:#bdbdbd;margin-bottom:4px}
input[type=text],input[type=tel]{width:100%;font:inherit;font-size:17px;padding:12px 0;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);outline:none;border-radius:0}
input::placeholder{color:var(--faint)}
input:focus{border-bottom-color:var(--ink)}
.err{font-size:12.5px;color:#ff6b6b;min-height:1.4em;margin:10px 0 0}
.actions{display:flex;gap:10px;align-items:center;margin-top:22px}
button{font:inherit;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;min-height:44px;padding:0 18px;border-radius:2px;cursor:pointer}
.primary{background:var(--ink);color:#0a0a0a;border:0}
.primary:hover{background:#fff}
.ghost{background:none;color:var(--soft);border:1px solid var(--line)}
.ghost:hover{color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
.step{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.bar i{transition:none}}
.done h3{font-family:Oswald,sans-serif;font-weight:600;font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.done p{color:#bdbdbd;margin:0 0 16px;font-size:14.5px}
.sum{margin:0;border-top:1px solid var(--line)}
.sum div{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum dt{width:6.5em;flex:none;color:var(--soft);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding-top:3px}
.sum dd{margin:0;overflow-wrap:anywhere}
footer{text-align:center;color:var(--soft);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:0 16px 34px}
footer small{display:block;text-transform:none;letter-spacing:0;font-size:12px;color:var(--faint);margin-top:8px}
</style>
</head>
<body>
<nav class="top">
  <a class="brand" href="#">Montserrat García</a>
  <a class="back" href="#">← Inicio</a>
</nav>

<section class="hero"><div class="bgimg" role="img" aria-label="Recorriendo la colonia con una vecina"></div>
  <h1><span class="a">Montserrat</span><span class="b">García</span></h1>
</section>

<main>
  <div class="card">
    <h2>Registro</h2>
    <p class="intro">Déjanos tus datos y nos pondremos en contacto contigo</p>
    <form id="f" novalidate>
      <div class="prog" id="prog"><span id="pl">Pregunta 1 / 3</span><div class="bar"><i id="pb"></i></div></div>
      <div id="stage"></div>
      <p class="err" id="err" role="alert"></p>
      <div class="actions" id="actions">
        <button type="submit" class="primary" id="next">Continuar →</button>
        <button type="button" class="ghost" id="prev">← Atrás</button>
      </div>
    </form>
  </div>
</main>

<footer>
  Montserrat García · Tus datos se usan solo para contactarte
  
</footer>

<script>
{
// Pega aquí la URL de tu Google Apps Script para guardar los registros en Google Sheets
const SHEET_URL='https://script.google.com/macros/s/AKfycby4_tx2wNP-_mPwyqHc4qT-QZAu8dLh8vUmRAgX9GLKGZUUSsSgP65eUkcCmaMOIUDX/exec';
const steps=[
  {id:'nombre',label:'Nombre completo',type:'text',ph:'Ej. María López García',ac:'name',
   check:v=>v.length>=3||'Escribe tu nombre completo.'},
  {id:'tel',label:'Teléfono / WhatsApp',type:'tel',ph:'Ej. 55 1234 5678',ac:'tel',
   check:v=>v.replace(/\D/g,'').length===10||'El número debe tener 10 dígitos.'},
  {id:'colonia',label:'Colonia o comunidad',type:'text',ph:'Ej. Centro',ac:'address-level3',
   check:v=>v.length>=2||'Escribe tu colonia o comunidad.'}
];
const data={};let cur=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const s=steps[cur];
  $('pl').textContent=`Pregunta ${cur+1} / ${steps.length}`;
  $('pb').style.width=`${(cur+1)/steps.length*100}%`;
  $('stage').innerHTML=`<div class="step"><label class="q" for="${s.id}">${s.label}</label>
    <input type="${s.type}" id="${s.id}" placeholder="${s.ph}" autocomplete="${s.ac}"${s.type==='tel'?' inputmode="numeric" maxlength="14"':''}></div>`;
  const inp=$(s.id);inp.value=data[s.id]||'';
  if(cur)inp.focus({preventScroll:true});
  $('err').textContent='';
  $('prev').style.display=cur?'':'none';
  $('next').textContent=cur===steps.length-1?'Enviar →':'Continuar →';
}
function finish(){
  $('prog').style.display='none';
  $('stage').innerHTML=`<div class="step done">
    <h3>¡Gracias, ${esc(data.nombre.split(' ')[0])}!</h3>
    <p>Recibimos tus datos. Pronto nos pondremos en contacto contigo.</p>
    <dl class="sum">
      <div><dt>Nombre</dt><dd>${esc(data.nombre)}</dd></div>
      <div><dt>Teléfono</dt><dd>${esc(data.tel)}</dd></div>
      <div><dt>Colonia</dt><dd>${esc(data.colonia)}</dd></div>
    </dl></div>`;
  $('err').textContent='';
  $('actions').innerHTML=`<button type="button" class="ghost" id="again">Nuevo registro</button>`;
  $('again').addEventListener('click',()=>location.reload());
}
$('f').addEventListener('submit',e=>{
  e.preventDefault();
  const s=steps[cur],v=$(s.id).value.trim(),r=s.check(v);
  if(r!==true){$('err').textContent=r;return}
  data[s.id]=v;
  if(cur<steps.length-1){cur++;render()}else{
    if(SHEET_URL){try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...data,fecha:new Date().toISOString()})})}catch(_){}}
    finish();
  }
});
$('prev').addEventListener('click',()=>{data[steps[cur].id]=$(steps[cur].id).value.trim();if(cur){cur--;render()}});
render();
}
</script>
</body>
</html>
